<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" fill="none">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Soft background glow -->
  <circle cx="360" cy="360" r="320" fill="url(#centerGlow)"/>

  <!-- Outer orbit -->
  <circle cx="360" cy="360" r="270" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-dasharray="10 8" opacity="0.5"/>

  <!-- Connector lines (thicker) -->
  <line x1="360" y1="360" x2="360" y2="68" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="360" y1="360" x2="613" y2="214" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="360" y1="360" x2="613" y2="506" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="360" y1="360" x2="360" y2="652" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="360" y1="360" x2="107" y2="506" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="360" y1="360" x2="107" y2="214" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- ====== CENTER HUB ====== -->
  <g filter="url(#cardShadow)">
    <circle cx="360" cy="360" r="130" fill="white" stroke="#e0e7ff" stroke-width="3"/>
    <circle cx="360" cy="360" r="110" fill="#6366f1" opacity="0.06"/>
    <text x="360" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#1e1b4b">Idarah</text>
    <text x="360" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#6366f1" letter-spacing="4">PLATFORM</text>
  </g>

  <!-- ====== 1. STRATEGY (top) ====== -->
  <g filter="url(#cardShadow)" transform="translate(360, 68)">
    <rect x="-95" y="-60" width="190" height="120" rx="20" fill="white" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="30" fill="#6366f1" opacity="0.10"/>
    <circle cx="0" cy="-16" r="30" fill="none" stroke="#6366f1" stroke-width="2"/>
    <!-- Target/crosshair icon -->
    <g transform="translate(0, -16)" stroke="#6366f1" fill="none" stroke-width="2.5">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="0" cy="0" r="5"/>
      <line x1="0" y1="-16" x2="0" y2="-12"/>
      <line x1="0" y1="12" x2="0" y2="16"/>
      <line x1="-16" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="16" y2="0"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Strategy</text>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Vision &amp; KPIs</text>
  </g>

  <!-- ====== 2. INNOVATION (top-right) ====== -->
  <g filter="url(#cardShadow)" transform="translate(613, 214)">
    <rect x="-95" y="-60" width="190" height="120" rx="20" fill="white" stroke="#fef3c7" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="30" fill="#f59e0b" opacity="0.10"/>
    <circle cx="0" cy="-16" r="30" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <!-- Lightbulb icon -->
    <g transform="translate(0, -16)" fill="#f59e0b">
      <path d="M0,-15 C-8,-15 -12,-8 -12,-3 C-12,3 -7,8 -6,11 L6,11 C7,8 12,3 12,-3 C12,-8 8,-15 0,-15 Z"/>
      <rect x="-4.5" y="12" width="9" height="4" rx="2"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Innovation</text>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Technology &amp; AI</text>
  </g>

  <!-- ====== 3. OPERATION (bottom-right) ====== -->
  <g filter="url(#cardShadow)" transform="translate(613, 506)">
    <rect x="-95" y="-60" width="190" height="120" rx="20" fill="white" stroke="#d1fae5" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="30" fill="#10b981" opacity="0.10"/>
    <circle cx="0" cy="-16" r="30" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Gear icon -->
    <g transform="translate(0, -16)" fill="#10b981">
      <path d="M-3,-15 L3,-15 L4.5,-10 L10,-7.5 L15,-10 L15,-4 L10,-1.5 L10,4 L15,7 L15,13 L10,10 L4.5,13 L3,18 L-3,18 L-4.5,13 L-10,10 L-15,13 L-15,7 L-10,4 L-10,-1.5 L-15,-4 L-15,-10 L-10,-7.5 L-4.5,-10 Z"/>
      <circle cx="0" cy="1" r="6" fill="white"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Operation</text>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7280">HR &amp; Tasks</text>
  </g>

  <!-- ====== 4. FINANCE (bottom) ====== -->
  <g filter="url(#cardShadow)" transform="translate(360, 652)">
    <rect x="-95" y="-60" width="190" height="120" rx="20" fill="white" stroke="#dbeafe" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="30" fill="#3b82f6" opacity="0.10"/>
    <circle cx="0" cy="-16" r="30" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <!-- Dollar coin icon -->
    <g transform="translate(0, -16)" fill="#3b82f6">
      <circle cx="0" cy="0" r="15"/>
      <text x="0" y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white">$</text>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Finance</text>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Budget &amp; Reports</text>
  </g>

  <!-- ====== 5. PRODUCTION (bottom-left) ====== -->
  <g filter="url(#cardShadow)" transform="translate(107, 506)">
    <rect x="-95" y="-60" width="190" height="120" rx="20" fill="white" stroke="#fee2e2" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="30" fill="#ef4444" opacity="0.10"/>
    <circle cx="0" cy="-16" r="30" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Factory icon -->
    <g transform="translate(0, -16)" fill="#ef4444">
      <path d="M-13,6 L-13,-6 L-7,-6 L-7,-12 L-4,-12 L-4,-6 L-1,-6 L-1,6 Z"/>
      <path d="M2,-3 L2,6 L13,6 L13,-3 L10,0 L7,-3 L4,0 Z"/>
      <rect x="-13" y="7" width="26" height="5" rx="2"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Production</text>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7280">POS &amp; Workflow</text>
  </g>

  <!-- ====== 6. SUPPORT (top-left) ====== -->
  <g filter="url(#cardShadow)" transform="translate(107, 214)">
    <rect x="-95" y="-60" width="190" height="120" rx="20" fill="white" stroke="#ede9fe" stroke-width="1.5"/>
    <circle cx="0" cy="-16" r="30" fill="#8b5cf6" opacity="0.10"/>
    <circle cx="0" cy="-16" r="30" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Headset icon -->
    <g transform="translate(0, -16)" fill="#8b5cf6">
      <path d="M-13,3 C-13,-9 -7,-15 0,-15 C7,-15 13,-9 13,3" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-15" y="1" width="7" height="12" rx="3.5"/>
      <rect x="8" y="1" width="7" height="12" rx="3.5"/>
      <path d="M8,12 C8,18 4,20 0,20" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Support</text>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Inventory &amp; CRM</text>
  </g>

  <!-- Orbit accent dots -->
  <circle cx="360" cy="90" r="5" fill="#6366f1" opacity="0.35"/>
  <circle cx="594" cy="225" r="5" fill="#f59e0b" opacity="0.35"/>
  <circle cx="594" cy="495" r="5" fill="#10b981" opacity="0.35"/>
  <circle cx="360" cy="630" r="5" fill="#3b82f6" opacity="0.35"/>
  <circle cx="126" cy="495" r="5" fill="#ef4444" opacity="0.35"/>
  <circle cx="126" cy="225" r="5" fill="#8b5cf6" opacity="0.35"/>
</svg>